name: Database backup

# Weekly encrypted dump of the Supabase database (the free plan has no backups).
# This repo is public: anyone signed in to GitHub can download artifacts and read logs,
# so the dump is encrypted before upload and no data is ever printed.
on:
  schedule:
    - cron: "0 20 * * 0" # Monday 03:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump roles, schema and data
        run: |
          mkdir -p dump
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/data.sql --use-copy --data-only
      - name: Encrypt
        run: |
          name="krs-backup-$(date -u +%Y-%m-%d)"
          tar -czf - -C dump . \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") -o "$name.tar.gz.gpg"
          rm -rf dump
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
