name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build needs these to exist, not to work: no page talks to Supabase at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic checks
        run: npm run check
      # Build first: it generates the route types (PageProps, RouteContext) that tsc needs.
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # Applies every migration to a throwaway Postgres in Docker and checks schema, RLS and grants.
      - name: Database check
        run: npm run check:db
